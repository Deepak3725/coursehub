<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
<div class="card border-0 shadow-lg p-4 p-md-5 rounded-4 w-100 card-dark" style="max-width:440px;">
<h2 class="text-center text-white fw-bold mb-1 text-uppercase">LOGIN</h2>
<p class="text-center text-secondary mb-4 small">Please enter your login and password!</p>
<div class="mb-3">
<input id="email" type="text" class="form-control rounded-pill px-4 py-2 input-custom" placeholder="Email"/>
</div>
<div class="mb-4">
<input id="password" type="password" class="form-control rounded-pill px-4 py-2 input-custom" placeholder="Password"/>
</div>
<div class="d-grid mb-3">
<button onclick="login()" class="btn btn-outline-success rounded-pill py-2 fw-semibold text-white">Login</button>
</div>
<p class="text-center text-secondary small mt-2 mb-0">
Don't have an account?
<a href="SignUp.html" class="text-info text-decoration-none fw-semibold">Sign Up</a>
</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="Js/login.js"></script>
</body>
</html>
